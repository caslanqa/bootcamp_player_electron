name: Release

# Two ways in:
#   - pick a bump under "Run workflow" and this run tags, builds and publishes
#   - push a v* tag yourself (npm run release && git push --follow-tags)
# Choosing "none" only builds installers: no tag, no Release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: 'Version bump'
        required: true
        type: choice
        default: none
        options:
          - none
          - auto
          - patch
          - minor
          - major
      platforms:
        description: 'Platforms to build'
        required: true
        type: choice
        default: all
        options:
          - all
          - macos
          - windows
          - linux

jobs:
  # Bumps package.json + CHANGELOG.md, commits, tags and pushes. A push made
  # with GITHUB_TOKEN does not start another workflow run, so this cannot loop
  # back through the tag trigger — this same run goes on to build and publish.
  version:
    name: tag
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release != 'none'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.bump.outputs.tag }}

    steps:
      - uses: actions/checkout@v4
        with:
          # bump.mts reads every commit since the last tag.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Identify the committer
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      # No npm ci on purpose: bump.mts needs nothing but node, and skipping the
      # install also skips the husky hooks, which have nothing to add here.
      - name: Bump and tag
        id: bump
        run: |
          set -euo pipefail
          level=''
          if [ "${{ github.event.inputs.release }}" != 'auto' ]; then
            level="--${{ github.event.inputs.release }}"
          fi
          node scripts/release/bump.mts $level

          # "auto" with only chores to show finds nothing to release and stops.
          # An empty output then makes the publish job skip itself.
          if tag="$(git describe --exact-match --tags HEAD 2>/dev/null)"; then
            echo "tag=$tag" >>"$GITHUB_OUTPUT"
            echo "Tagged $tag"
          else
            echo 'tag=' >>"$GITHUB_OUTPUT"
            echo 'Nothing to release — no tag created.'
          fi

      - name: Push the commit and tag
        if: steps.bump.outputs.tag != ''
        run: git push --follow-tags origin HEAD:${{ github.ref_name }}

      - name: Summary
        run: |
          {
            if [ -n '${{ steps.bump.outputs.tag }}' ]; then
              echo '### Tagged ${{ steps.bump.outputs.tag }}'
            else
              echo '### No release'
              echo ''
              echo 'No feat, fix or breaking change since the last tag. Choose an'
              echo 'explicit patch, minor or major if you want one anyway.'
            fi
          } >>"$GITHUB_STEP_SUMMARY"

  build:
    name: ${{ matrix.name }}
    needs: version
    # `version` is skipped on a tag push and for release=none; neither is a failure.
    if: always() && (needs.version.result == 'success' || needs.version.result == 'skipped')
    # Every platform packages itself: @ffmpeg-installer only fetches the host's
    # binary, so a cross-built app would ship without ffmpeg. That applies to the
    # CPU architecture too — macos-latest is arm64, hence arm64-only mac builds.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            runner: macos-latest
            pack: npm run pack:mac
          - name: windows
            runner: windows-latest
            pack: npm run pack:win
          - name: linux
            runner: ubuntu-latest
            pack: npm run pack:linux

    env:
      # Unsigned builds; build/after-pack.js ad-hoc signs macOS bundles.
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - name: Skip unselected platform
        id: gate
        shell: bash
        run: |
          want="${{ github.event.inputs.platforms || 'all' }}"
          if [ "$want" = "all" ] || [ "$want" = "${{ matrix.name }}" ]; then
            echo "run=true" >>"$GITHUB_OUTPUT"
          else
            echo "run=false" >>"$GITHUB_OUTPUT"
            echo "Skipping ${{ matrix.name }} (platforms=$want)"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
        with:
          # Build the tag this run just created, so the installer filenames carry
          # the version being published. Empty falls back to the trigger ref.
          ref: ${{ needs.version.outputs.tag || github.ref }}

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: npm ci

      - name: Ensure Electron binary
        if: steps.gate.outputs.run == 'true'
        run: node -e "require('electron')"

      - name: Typecheck
        if: steps.gate.outputs.run == 'true'
        run: npm run typecheck

      - name: Unit + integration tests
        if: steps.gate.outputs.run == 'true'
        run: npm test

      - name: Package
        if: steps.gate.outputs.run == 'true'
        env:
          # Repository secret; baked into the bundle at build time so it never
          # lands in this public repo. Add it under Settings -> Secrets.
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: ${{ matrix.pack }}

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.run == 'true'
        with:
          name: installers-${{ matrix.name }}
          # Short-lived: the GitHub Release is the durable copy.
          retention-days: 1
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb

  publish:
    name: GitHub Release
    needs: [version, build]
    # Publish whenever this run has a tag to publish: one it just created, or one
    # that was pushed by hand. Never for a plain "none" build.
    if: >-
      always() && needs.build.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') || needs.version.outputs.tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    env:
      TAG: ${{ needs.version.outputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: installers-*
          merge-multiple: true

      - name: Build release notes from CHANGELOG
        run: node scripts/release/notes.mts "$TAG" > RELEASE_NOTES.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" \
            --title "Bootcamp Player $TAG" \
            --notes-file RELEASE_NOTES.md \
            installers/*

      - name: Summary
        env:
          VERSION: ${{ env.TAG }}
          REPO: ${{ github.repository }}
        run: scripts/ci/release-summary.sh

  # Closes the loop for a "none" run, so nobody hunts for a Release that was
  # never meant to exist.
  explain:
    name: no release
    needs: [version, build]
    if: always() && needs.build.result == 'success' && github.event.inputs.release == 'none'
    runs-on: ubuntu-latest
    steps:
      - name: Say why
        run: |
          {
            echo '### Installers built, nothing published'
            echo ''
            echo 'You picked **none**, so this run created no tag and no Release —'
            echo 'just the one-day artifacts. Run it again with a bump (patch,'
            echo 'minor, major or auto) to tag and publish.'
          } >>"$GITHUB_STEP_SUMMARY"
