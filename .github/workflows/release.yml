name: Release

# `npm run release` writes the tag; pushing it is what publishes.
#   git push --follow-tags origin main
# workflow_dispatch builds the installers without publishing anything.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      platforms:
        description: 'Platforms to build'
        required: true
        type: choice
        default: all
        options:
          - all
          - macos
          - windows
          - linux

jobs:
  build:
    name: ${{ matrix.name }}
    # Every platform packages itself: @ffmpeg-installer only fetches the host's
    # binary, so a cross-built app would ship without ffmpeg. That applies to the
    # CPU architecture too — macos-latest is arm64, hence arm64-only mac builds.
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos
            runner: macos-latest
            pack: npm run pack:mac
          - name: windows
            runner: windows-latest
            pack: npm run pack:win
          - name: linux
            runner: ubuntu-latest
            pack: npm run pack:linux

    env:
      # Unsigned builds; build/after-pack.js ad-hoc signs macOS bundles.
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - name: Skip unselected platform
        id: gate
        shell: bash
        run: |
          want="${{ github.event.inputs.platforms || 'all' }}"
          if [ "$want" = "all" ] || [ "$want" = "${{ matrix.name }}" ]; then
            echo "run=true" >>"$GITHUB_OUTPUT"
          else
            echo "run=false" >>"$GITHUB_OUTPUT"
            echo "Skipping ${{ matrix.name }} (platforms=$want)"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: npm ci

      - name: Ensure Electron binary
        if: steps.gate.outputs.run == 'true'
        run: node -e "require('electron')"

      - name: Typecheck
        if: steps.gate.outputs.run == 'true'
        run: npm run typecheck

      - name: Unit + integration tests
        if: steps.gate.outputs.run == 'true'
        run: npm test

      - name: Package
        if: steps.gate.outputs.run == 'true'
        env:
          # Repository secret; baked into the bundle at build time so it never
          # lands in this public repo. Add it under Settings -> Secrets.
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: ${{ matrix.pack }}

      - uses: actions/upload-artifact@v4
        if: steps.gate.outputs.run == 'true'
        with:
          name: installers-${{ matrix.name }}
          # Short-lived: the GitHub Release is the durable copy.
          retention-days: 1
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb

  publish:
    name: GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/download-artifact@v4
        with:
          path: installers
          pattern: installers-*
          merge-multiple: true

      - name: Build release notes from CHANGELOG
        run: node scripts/release/notes.mts "${{ github.ref_name }}" > RELEASE_NOTES.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "Bootcamp Player ${{ github.ref_name }}" \
            --notes-file RELEASE_NOTES.md \
            installers/*

      - name: Summary
        env:
          VERSION: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: scripts/ci/release-summary.sh
