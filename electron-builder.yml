appId: com.caslanqa.bootcampplayer
productName: Bootcamp Player
copyright: Copyright © 2026 caslanqa
# Space-free installer names so the install commands in the README stay simple.
artifactName: BootcampPlayer-${version}-${arch}.${ext}
# Gives unsigned macOS bundles a valid ad-hoc signature — see build/after-pack.js.
afterPack: build/after-pack.js
directories:
  output: release
  # build/icon.png (1024x1024, transparent) — .icns/.ico are derived from it.
  buildResources: build
files:
  - out/**
  - package.json
  - '!**/*.map'
# ffmpeg/ffprobe are native binaries — they must live outside the asar to be spawnable.
asarUnpack:
  - node_modules/@ffmpeg-installer/**
  - node_modules/@ffprobe-installer/**

mac:
  # arm64 only. An x64 bundle built on an arm64 host gets no ffmpeg binary
  # (@ffmpeg-installer resolves per host), so it would ship broken. Add
  # `arch: [arm64, x64]` back only alongside an x64 macOS builder.
  target:
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  category: public.app-category.education
  darkModeSupport: true
  # No Apple Developer cert wired up yet: ship unsigned, adhoc-signed builds.
  identity: null

win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]

nsis:
  # Distinct from the portable .exe, which takes the global artifactName.
  artifactName: BootcampPlayer-Setup-${version}-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true

linux:
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Education
  maintainer: caslanqa
  # Otherwise the command would be the package.json name, bootcamp_player_electron.
  executableName: bootcamp-player
